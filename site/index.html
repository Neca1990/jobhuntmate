<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in</title>
  <link rel="stylesheet" href="style.css?v=__V__">
</head>
<body>
  <div id="loader" class="loader" role="status" aria-label="Loading"><div class="spinner"></div></div>

  <!-- signing in and accepting the privacy notice share one screen: an animated side and the step on the other -->
  <div id="welcome" class="consent hidden">
    <!-- the left side is decoration: postings found, scored and sent, with the data staying private -->
    <div class="consent-hero" aria-hidden="true">
      <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
      <div class="radar">
        <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
        <span class="sweep"></span>
        <span class="lens">🔎</span>
      </div>
      <div class="flow">
        <div class="jobcard c1"><b data-t="hero.job1"></b><span><span data-t="hero.remote"></span> · <em>8/10</em></span></div>
        <div class="jobcard c2"><b data-t="hero.job2"></b><span><span data-t="hero.hybrid"></span> · <em>7/10</em></span></div>
        <div class="jobcard c3"><b data-t="hero.job3"></b><span><span data-t="hero.eu"></span> · <em>9/10</em></span></div>
        <div class="jobcard c4"><b data-t="hero.job4"></b><span><span data-t="hero.remote"></span> · <em>8/10</em></span></div>
      </div>
      <div class="hero-text">
        <h2 data-brand-name></h2>
        <p data-t="consent.hero"></p>
      </div>
      <div class="shield"><span class="lock">🔒</span> <span data-t="consent.badge"></span></div>
    </div>

    <div class="consent-side">
      <div id="login" class="consent-panel login-panel hidden">
        <ol class="steps">
          <li class="now"><span class="dot">1</span><span data-t="consent.step1"></span></li>
          <li><span class="dot">2</span><span data-t="consent.step2"></span></li>
          <li><span class="dot">3</span><span data-t="consent.step3"></span></li>
        </ol>

      <div class="lang" data-lang-switch></div>
      <h1 data-brand-name></h1>
      <p class="muted" data-brand-tagline></p>
      <section id="step-start">
        <p data-t="intro"></p>
        <label for="username" data-t="username_label"></label>
        <input id="username" autocomplete="username" placeholder="@username">
        <button id="start" class="wide" data-t="start"></button>
      </section>
      <section id="step-wait" class="hidden">
        <p data-t="tap_number"></p>
        <div id="match" class="match"></div>
        <p class="muted" id="where"></p>
        <a id="bot-link" class="button wide" target="_blank" rel="noopener" data-t="open_bot"></a>
        <p class="waiting muted"><span class="dot"></span> <span data-t="waiting"></span></p>
        <div class="chat-code">
          <p class="muted" data-t="chat_code_label"></p>
          <div class="row"><span id="chat-code" class="code-big"></span><button id="chat-code-copy" class="ghost small" data-t="copy"></button></div>
        </div>
        <details id="code-box">
          <summary class="muted" data-t="use_code"></summary>
          <input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
          <button id="verify" class="wide" data-t="verify"></button>
        </details>
        <button id="restart" class="ghost wide" data-t="restart"></button>
      </section>
      <p class="error" id="login-error" role="alert"></p>
      <p class="muted small"><a href="/privacy.html" target="_blank" rel="noopener" data-t="privacy_link"></a></p>
          </div>
      <div id="consent" class="consent-panel hidden">
        <ol class="steps">
          <li class="done"><span class="dot">✓</span><span data-t="consent.step1"></span></li>
          <li class="now"><span class="dot">2</span><span data-t="consent.step2"></span></li>
          <li><span class="dot">3</span><span data-t="consent.step3"></span></li>
        </ol>
        <h1 data-t="consent.title"></h1>
        <p data-t="consent.intro"></p>
        <div class="points">
          <div class="point"><span class="icon">🛡️</span><span data-t="consent.p1"></span></div>
          <div class="point"><span class="icon">🚫</span><span data-t="consent.p2"></span></div>
          <div class="point"><span class="icon">🗂️</span><span data-t="consent.p3"></span></div>
        </div>
        <p><a href="/privacy.html" target="_blank" rel="noopener" data-t="consent.read"></a> ↗</p>
        <label class="agree"><input type="checkbox" id="consent-check"><span class="box"></span><span data-t="consent.check"></span></label>
        <button id="consent-accept" class="wide go" data-t="consent.accept" disabled></button>
        <button id="consent-out" class="ghost wide" data-t="sign_out"></button>
        <p class="error" id="consent-error" role="alert"></p>
      </div>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="topbar">
      <strong data-brand-name></strong>
      <nav id="tabs"></nav>
      <div class="lang" data-lang-switch></div>
      <button id="sign-out" class="ghost small" data-t="sign_out"></button>
    </header>
    <main class="app">
      <section id="tab-searches"></section>
      <section id="tab-applications" class="hidden"></section>
      <section id="tab-agencies" class="hidden"></section>
      <section id="tab-account" class="hidden"></section>
      <section id="tab-admin" class="hidden"></section>
    </main>
    <div id="savebar" class="savebar hidden">
      <span id="save-status" role="status"></span>
      <button id="save" data-t="save"></button>
    </div>
  </div>

  <div id="onboarding" class="overlay hidden"></div>
  <dialog id="preview" class="preview">
    <div class="preview-head">
      <strong id="preview-title"></strong>
      <div class="row">
        <button id="preview-download" class="ghost small" type="button" data-t="f.download"></button>
        <button id="preview-close" class="ghost small" type="button" data-t="close"></button>
      </div>
    </div>
    <div id="preview-pages" class="preview-pages"></div>
    <div id="preview-feedback" class="preview-feedback hidden">
      <label><span data-t="ag.change_label"></span><textarea id="preview-text" rows="2" maxlength="2000"></textarea></label>
      <span id="preview-count" class="muted counter"></span>
      <button id="preview-send" class="small" type="button" data-t="ag.send_change"></button>
    </div>
  </dialog>
  <div id="version" class="version" title="Version"></div>

  <script type="module" src="app.js?v=__V__"></script>
</body>
</html>
